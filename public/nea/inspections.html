<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEA - Inspections</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>
    <!-- ===== MAIN CONTENT ===== -->
    <main class="mx-auto max-w-6xl p-8 pb-32">
        <div class="flex items-center justify-between mb-2">
            <h1 class="text-3xl font-bold text-gray-800">Inspections</h1>
            <button id="add-inspection-btn"
                class="flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition">
                <span class="text-lg font-bold">+</span> Add Inspection
            </button>
        </div>
        <p class="text-sm text-gray-500 mb-6">Search for a stall to view, edit, or manage its inspection records.</p>

        <!-- ===== SEARCH & FILTER ===== -->
        <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex-1 min-w-[200px]">
                    <input type="text" id="search-stall"
                        placeholder="Search stall name..."
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                    <select id="filter-grade"
                        class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="all">All Grades</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <button id="reset-filter-btn"
                    class="rounded-lg bg-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-300 transition">
                    Reset
                </button>
                <span id="filter-result-count" class="text-sm text-gray-400 ml-auto"></span>
            </div>
        </section>

        <!-- ===== INSPECTIONS TABLE ===== -->
        <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
            <div id="inspection-container">
                <p class="text-sm text-gray-500">Loading inspections...</p>
            </div>
        </section>
    </main>

    <!-- ===== ADD / EDIT INSPECTION MODAL ===== -->
    <div id="inspection-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <div class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800">Add New Inspection</h2>
                <button id="close-modal-btn" class="text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            </div>

            <form id="inspection-form" class="space-y-4">
                <!-- Inspection ID (hidden, for edit) -->
                <input type="hidden" id="modal-inspection-id" />

                <!-- Stall Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Stall</label>
                    <select id="modal-stall-id" required
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="">Loading stalls...</option>
                    </select>
                </div>

                <!-- Score -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Score (0-100)</label>
                    <input type="number" id="modal-score" min="0" max="100" required
                        placeholder="Enter score"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                </div>

                <!-- Hygiene Grade -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Hygiene Grade</label>
                    <select id="modal-grade" required
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="">Select Grade</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <!-- Remarks -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Remarks</label>
                    <textarea id="modal-remarks" rows="3" placeholder="Enter remarks..."
                        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3 pt-2">
                    <button type="submit"
                        class="flex-1 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition">
                        Save
                    </button>
                    <button type="button" id="cancel-modal-btn"
                        class="flex-1 rounded-lg bg-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>

            <div id="modal-message" class="mt-3 hidden rounded-lg p-3 text-center text-sm"></div>
        </div>
    </div>

    <script src="/js/const.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/nea-inspection.js"></script>
</body>

</html>
