<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEA - Complaints</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="mx-auto max-w-6xl p-8 pb-32">
        <h1 class="text-3xl font-bold mb-2 text-gray-800">Customer Complaints</h1>
        <p class="text-sm text-gray-500 mb-6">View all customer complaints across all stalls.</p>

        <!-- ===== FILTERS ===== -->
        <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex-1 min-w-[180px]">
                    <input type="text" id="search-stall"
                        placeholder="Search stall name..."
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" />
                </div>
                <div>
                    <select id="filter-status"
                        class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="all">All Status</option>
                        <option value="Open">Open</option>
                        <option value="Investigating">Investigating</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <button id="reset-filter-btn"
                    class="rounded-lg bg-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-300 transition">
                    Reset
                </button>
                <span id="filter-result-count" class="text-sm text-gray-400 ml-auto"></span>
            </div>
        </section>

        <!-- ===== COMPLAINTS TABLE ===== -->
        <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
            <div class="overflow-x-auto">
                <div id="complaint-container">
                    <p class="text-sm text-gray-500">Loading complaints...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/const.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/nea-complaints.js"></script>
</body>

</html>
