<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="flex justify-between">
        <div class="flex gap-5">
            <a href="/customer" class="text-xl">Home</a>
            <a href="/customer/hawkers.html" class="text-xl">Browse</a>
        </div>
        <div class="flex gap-5">
            <a href="/customer/cart.html" class="text-xl">Cart</a>
            <a href="/customer/profile.html" class="text-xl">Profile</a>
            <a href="/customer/complaint.html" class="text-xl text-red-600 font-semibold">Complaint</a>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="mx-auto max-w-3xl space-y-6 p-8 pb-32">
        <h1 class="text-3xl font-bold">Submit a Complaint</h1>
        <p class="text-sm text-gray-500">Submit a formal complaint about a stall's food quality or service.</p>

        <!-- ===== COMPLAINT FORM ===== -->
        <section class="rounded-xl border bg-white p-6 shadow-sm">
            <form id="complaint-form" class="space-y-5">
                <!-- Stall Selection -->
                <div>
                    <label for="stallSelect" class="block text-sm font-medium text-gray-700">
                        Select Stall
                    </label>
                    <select id="stallSelect" required
                        class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black">
                        <option value="">Loading stalls...</option>
                    </select>
                </div>

                <!-- Subject -->
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700">
                        Subject
                    </label>
                    <input type="text" id="subject" required placeholder="e.g. Food was undercooked"
                        class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black" />
                </div>

                <!-- Description -->
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">
                        Description
                    </label>
                    <textarea id="description" rows="5" required placeholder="Describe your issue in detail..."
                        class="mt-1 w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-black focus:outline-none focus:ring-1 focus:ring-black"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full rounded-lg bg-black px-6 py-3 font-medium text-white transition hover:bg-gray-800">
                    Submit Complaint
                </button>
            </form>

            <!-- Status Message -->
            <div id="status-message" class="hidden mt-4 rounded-lg p-4 text-center"></div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="fixed bottom-0 left-0 right-0 border-t bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-5xl items-center justify-between p-5">
            <p class="text-sm text-gray-500">© 2026 Hawker Centre</p>
            <p class="text-sm text-gray-500">Enjoy your meal!</p>
        </div>
    </footer>

    <script src="/js/const.js"></script>
    <script>
        const token = sessionStorage.getItem(SS_KEYS.accessToken);
        const stallSelect = document.getElementById('stallSelect');
        const form = document.getElementById('complaint-form');
        const statusMsg = document.getElementById('status-message');

        // ===== Load stalls =====
        async function loadStalls() {
            try {
                const res = await fetch('/stalls', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const stalls = await res.json();

                stallSelect.innerHTML = '';
                if (stalls.length === 0) {
                    stallSelect.innerHTML = '<option value="">No stalls available</option>';
                    return;
                }

                stalls.forEach(stall => {
                    const option = document.createElement('option');
                    option.value = stall.stall_id;
                    option.textContent = `${stall.stall_name} (${stall.stall_unit_no})`;
                    stallSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to load stalls:', err);
                stallSelect.innerHTML = '<option value="">Failed to load stalls</option>';
            }
        }

        // ===== Submit complaint =====
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const stallId = stallSelect.value;
            const subject = document.getElementById('subject').value.trim();
            const description = document.getElementById('description').value.trim();

            if (!stallId || !subject || !description) {
                showMessage('Please fill in all fields.', 'red');
                return;
            }

            try {
                const res = await fetch(`/stalls/${stallId}/complaints`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({ subject, description })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('✅ Complaint submitted successfully!', 'green');
                    form.reset();
                    loadStalls();
                } else {
                    showMessage(`❌ ${data.error || data.message || 'Submission failed'}`, 'red');
                }
            } catch (err) {
                showMessage('❌ Network error. Please try again.', 'red');
                console.error(err);
            }
        });

        function showMessage(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `rounded-lg p-4 text-center ${
                type === 'green' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
            }`;
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 5000);
        }

        // ===== Init =====
        loadStalls();
    </script>
</body>

</html>
