<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stall</title>

    <link rel="icon" type="image/x-icon" href="/assets/logo.jpg" />
    <link rel="stylesheet" href="../css/output.css" />
  </head>

  <body>
    <main class="mx-auto max-w-5xl space-y-6 p-8 pb-32">
      <h1 class="text-3xl font-bold">Cart</h1>
      <section id="container" class="grid gap-5"></section>
      <section
        id="promotion-container"
        class="flex flex-col justify-center gap-2 border rounded-xl p-6 shadow-sm mt-20! hidden!"
      >
        <h2 class="text-xl font-semibold">Promo Code</h2>
        <span
          id="promotion-msg"
          class="rounded-xl p-3 border bg-green-300 grow hidden"
        ></span>
        <div class="flex gap-5">
          <input
            id="promotion-input"
            type="text"
            placeholder="Enter Promo Code"
            class="border rounded-xl p-3 w-2/3"
          />
          <button
            id="promotion-btn"
            class="rounded-xl p-3 border bg-green-300 grow"
          >
            Enter
          </button>
        </div>
        <div id="promotion-valids" class=""></div>
      </section>
      <!-- payment method -->
      <section
        id="payment-container"
        class="hidden rounded-xl border bg-white p-6 shadow-sm mt-20!"
      >
        <h2 class="text-xl font-semibold">Payment Method</h2>
        <p class="mt-1 text-sm text-gray-500">
          Select your preferred payment method.
        </p>

        <div class="mt-6 space-y-3">
          <label
            class="flex cursor-pointer items-center gap-4 rounded-lg border p-4 transition hover:bg-gray-50 has-checked:border-black has-checked:bg-gray-50"
          >
            <input
              type="radio"
              name="payment"
              value="card"
              class="h-4 w-4 accent-black"
              checked
            />

            <div class="flex-1">
              <p class="font-medium">Credit / Debit Card</p>
              <p class="text-sm text-gray-500">
                Visa, Mastercard, American Express
              </p>
            </div>
          </label>

          <label
            class="flex cursor-pointer items-center gap-4 rounded-lg border p-4 transition hover:bg-gray-50 has-checked:border-black has-checked:bg-gray-50"
          >
            <input
              type="radio"
              name="payment"
              value="paynow"
              class="h-4 w-4 accent-black"
            />

            <div class="flex-1">
              <p class="font-medium">PayNow</p>
              <p class="text-sm text-gray-500">
                Pay instantly using your banking app.
              </p>
            </div>
          </label>

          <label
            class="flex cursor-pointer items-center gap-4 rounded-lg border p-4 transition hover:bg-gray-50 has-checked:border-black has-checked:bg-gray-50"
          >
            <input
              type="radio"
              name="payment"
              value="cash"
              class="h-4 w-4 accent-black"
            />

            <div class="flex-1">
              <p class="font-medium">Cash</p>
              <p class="text-sm text-gray-500">
                Pay at the stall upon collection.
              </p>
            </div>
          </label>
        </div>
      </section>
    </main>

    <footer
      class="fixed bottom-0 left-0 right-0 border-t bg-white/95 backdrop-blur"
    >
      <div class="mx-auto flex max-w-5xl items-center justify-between p-5">
        <div>
          <p class="text-sm text-gray-500">Total</p>
          <p id="cart-total" class="text-2xl font-bold">$0.00</p>
        </div>

        <div class="flex gap-4">
          <!-- FOR TESTING -->
          <button
            id="checkout-btn"
            class="rounded-lg bg-black px-8 py-3 font-medium text-white transition hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Checkout (success)
          </button>
          <button
            id="checkout-fail-btn"
            class="rounded-lg bg-red-400 px-8 py-3 font-medium text-white transition hover:bg-red-600 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Checkout (failure)
          </button>
        </div>
      </div>
    </footer>

    <script src="/js/const.js"></script>
    <script src="/js/navbar.js"></script>
    <script type="module" src="/js/cart.js"></script>
    <script type="module" src="/js/helper.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="/js/chatbot.js"></script>
  </body>
</html>
