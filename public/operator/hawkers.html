<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operator Dashboard - Hawker Centres</title>

    <link rel="stylesheet" href="../css/output.css" />
    <link rel="stylesheet" href="/css/hawkers.css" />
  </head>

  <body class="bg-white text-slate-900">
    <nav class="flex items-center justify-between px-12 py-6 border-b border-slate-100">
      <div class="flex items-center gap-8">
        <a href="/operator" class="text-base text-slate-700 hover:text-slate-900">Home</a>
        <a href="/operator/hawkers.html" class="text-base text-slate-900 font-medium">Hawker Centres</a>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-12 py-12">
      <h1 class="text-4xl font-medium mb-2">Hawker Centres</h1>
      <p id="message" class="text-red-600 text-base mt-3"></p>
      <div
        id="centreGrid"
        class="grid grid-cols-1 gap-6 mt-8"
      ></div>
    </main>
    <script src="/js/const.js"></script>
    <script type="module">
      const centreGrid = document.getElementById("centreGrid");
      const messageEl = document.getElementById("message");

      async function loadHawkerCentres() {
        try {
          const token = sessionStorage.getItem(SS_KEYS.accessToken);
          const response = await fetch("/hawkercentre", {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (!response.ok) {
            messageEl.textContent =
              data.error || "Failed to load hawker centres";
            return;
          }

          if (data.length === 0) {
            messageEl.textContent = "No hawker centres found.";
            return;
          }

           centreGrid.innerHTML = data
            .map(
              (centre) => `
              <div class="border border-slate-300 rounded-xl p-6 cursor-pointer hover:bg-slate-50 transition-colors"
                   onclick="window.location.href='hawkerDetails.html?id=${centre.hawker_centre_id}'">
                <h2 class="text-xl font-bold">${centre.centre_name}</h2>
                <p class="text-slate-500">${centre.address}</p>
              </div>
            `
            )
          
            .join("");
        } catch (err) {
          console.error(err);
          messageEl.textContent =
            "Something went wrong while loading the hawker centres.";
        }
      }

      loadHawkerCentres();
    </script>
  </body>
</html>
